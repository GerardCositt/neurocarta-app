server {
    listen 80;
    server_name app.neurocarta.ai demo.neurocarta.ai *.neurocarta.ai;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name app.neurocarta.ai demo.neurocarta.ai *.neurocarta.ai;

    ssl_certificate /etc/letsencrypt/live/neurocarta-wildcard/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/neurocarta-wildcard/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 20M;

    location / {
        proxy_pass http://app:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
